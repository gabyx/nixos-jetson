name: normal
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: eval ${{ matrix.nixos }} (installer=${{ matrix.installer }}, cross=${{ matrix.cross }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nixos:
          - thor-devkit
        installer:
          - "true"
          - "false"
        cross:
          - "true"
          - "false"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix

      - name: Eval "jetson thor".
        run: |
          just ci just eval \
            --nixos=${{ matrix.nixos }} \
            --cross=${{ matrix.cross }} \
            --installer=${{ matrix.installer }}

  build:
    name: build ${{ matrix.nixos }} (installer=${{ matrix.installer }}, cross=${{ matrix.cross }})
    runs-on: ${{ matrix.cross == 'false' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}

    environment: deploy
    strategy:
      fail-fast: false
      matrix:
        nixos:
          - thor-devkit
        installer:
          - "true"
          - "false"
        cross:
          - "true"
          - "false"
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix

      - name: Build "${{ matrix.nixos }}".
        id: build
        # Cross builds are best-effort: a failure here is downgraded to a
        # warning (see below) instead of failing the job with a red ✗.
        continue-on-error: ${{ matrix.cross == 'true' }}

        run: |
          just ci just build \
            --nixos=${{ matrix.nixos }} \
            --cross=${{ matrix.cross }} \
            --installer=${{ matrix.installer }}

      - name: Warn on failed cross build.
        if: matrix.cross == 'true' && steps.build.outcome == 'failure'
        run: |
          echo "::warning title=Cross build failed::Best-effort cross build for ${{ matrix.nixos }} (installer=${{ matrix.installer }}) failed and was ignored."

      - name: Upload to 'cachix'.
        if: github.ref == 'refs/heads/main' && steps.build.outcome == 'success'
        run: |
          just ci just upload \
          --nixos=${{ matrix.nixos }} \
          --cross=${{ matrix.cross }} \
